- baseInfo:
    api_name: Deletes a pet
    url: https://petstore.swagger.io/v2/pet/{petId}
    method: DELETE
    header:
      Content-Type: application/json;charset=UTF-8
      token: ${get_extract_data(token)}
  testCase:
  - case_name: 自动生成：Deletes a pet_正常场景
    json:
      api_key: auto_string
      petId: auto_string
    validation:
      - eq: { 'status_code': 200 }  # 改成校验 HTTP 状态码为 200
    extract:
      auto_id: $.data.id
