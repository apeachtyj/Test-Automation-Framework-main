- baseInfo:
    api_name: Logs out current logged in user session
    url: https://petstore.swagger.io/v2/user/logout
    method: GET
    header:
      Content-Type: application/x-www-form-urlencoded;charset=UTF-8
      token: ${get_extract_data(token)}
  testCase:
  - case_name: 自动生成：Logs out current logged in user session_正常场景
    params:
      mock_key: mock_value
    validation:
      - eq: { 'status_code': 200 }  # 改成校验 HTTP 状态码为 200
    extract:
      auto_id: $.data.id
