- baseInfo:
    api_name: Create user
    url: https://petstore.swagger.io/v2/user
    method: POST
    header:
      Content-Type: application/json;charset=UTF-8
      token: ${get_extract_data(token)}
  testCase:
  - case_name: 自动生成：Create user_正常场景
    json:
      body: auto_string
    validation:
      - eq: { 'status_code': 200 }  # 改成校验 HTTP 状态码为 200
    extract:
      auto_id: $.data.id
