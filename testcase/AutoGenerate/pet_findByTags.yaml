- baseInfo:
    api_name: Finds Pets by tags
    url: https://petstore.swagger.io/v2/pet/findByTags
    method: GET
    header:
      Content-Type: application/x-www-form-urlencoded;charset=UTF-8
      token: ${get_extract_data(token)}
  testCase:
  - case_name: 自动生成：Finds Pets by tags_正常场景
    params:
      tags: auto_string
    validation:
      - eq: { 'status_code': 200 }  # 改成校验 HTTP 状态码为 200
    extract:
      auto_id: $.data.id
