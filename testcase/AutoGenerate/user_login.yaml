- baseInfo:
    api_name: Logs user into the system
    url: https://petstore.swagger.io/v2/user/login
    method: GET
    header:
      Content-Type: application/x-www-form-urlencoded;charset=UTF-8
      token: ${get_extract_data(token)}
  testCase:
  - case_name: 自动生成：Logs user into the system_正常场景
    params:
      username: auto_string
      password: auto_string
    validation:
      - eq: { 'status_code': 200 }  # 改成校验 HTTP 状态码为 200
    extract:
      auto_id: $.data.id
